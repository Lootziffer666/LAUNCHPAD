<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LAUNCHPAD — Fächerwand</title>
<style>
/* ============================================================
   LAUNCHPAD — Fächerwand
   Sechs Fächer mit Deckeln. In jedem Fach wartet ein Desktop.
   Ein Klick: der Deckel schwingt auf, die Kamera fährt hinein,
   bis das Fach das ganze Bild füllt.

   Tokens bewusst aus css/base.css übernommen, damit die Wand
   zum restlichen Shell passt (comet-cyan, gold, ease-metro).
   ============================================================ */

:root {
  /* Grund — kalte Nacht */
  --night:      #04091a;

  /* Korpus der Fächer */
  --shell:      #14356e;
  --shell-lo:   #0b1f47;

  /* Akzente (base.css) */
  --cyan:       #38bdf8;
  --gold:       #ffc83d;

  /* Schrift */
  --ink:        #eef4ff;
  --ink-soft:   #b7c7e9;
  --ink-mute:   #7b8bb4;

  --ease:  cubic-bezier(.25, 1, .5, 1);      /* ease-metro */
  --lid:   cubic-bezier(.22, .9, .24, 1.02); /* Deckel: kurzes Nachfedern */
  --dolly: cubic-bezier(.33, .05, .12, 1);   /* Kamerafahrt: sofort anschieben, gleiten, weich setzen */

  --t-lid:   560ms;
  --t-dolly: 860ms;

  /* Zwei Formate, die zusammenspielen müssen:
     --vw/--vh  Form des Fachs = Form des Bildschirms. Nur so füllt das Fach
                am Ende exakt das Bild, ohne dass an den Kanten etwas fehlt.
     --sw/--sh  Bühne des Desktops. Breite fest, Höhe folgt dem Bildschirm,
                aber begrenzt — sonst wird der Desktop auf extremen Formaten
                so flach, dass der Inhalt nicht mehr hineinpasst. Passt die
                Bühne nicht zur Fachform, sitzt sie mittig mit dunklen
                Rändern statt beschnitten zu werden.
     Beide werden in JS gesetzt; hier stehen nur die Startwerte. */
  --vw: 16; --vh: 9;
  --sw: 1400; --sh: 788;
  --gap: 26px;

  --font: "Outfit", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--night);
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; border-radius: 10px; }

/* ============================================================
   Raum
   ============================================================ */

.room {
  position: fixed; inset: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
}

#sky { position: absolute; inset: 0; z-index: 0; }

.room::after { /* Vignette — der Raum liegt im Halbdunkel */
  content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 45%, transparent 42%, rgba(2,5,15,.72) 100%);
  opacity: .9;
}

/* Beim Hineinfahren geht im Raum das Licht aus. Eine einzige Fläche statt
   sechs einzeln ausgeblendeter Fächer — das ist der Unterschied zwischen
   einer flüssigen und einer hakeligen Fahrt. */
.scrim {
  position: fixed; inset: 0; z-index: 50; pointer-events: none;
  background: var(--night); opacity: 0;
  transition: opacity .52s var(--ease);
}
.room.zoomed .scrim { opacity: .95; }

/* ---- Kopfzeile ---- */

.hud {
  position: relative; z-index: 4;
  display: flex; align-items: center; justify-content: space-between;
  padding: 26px 42px 0;
}
.room.zoomed .hud { pointer-events: none; }

.who { display: flex; align-items: center; gap: 15px; }
.avatar {
  width: 58px; height: 58px; border-radius: 50%; flex: none;
  border: 2px solid rgba(160,205,255,.55);
  background:
    radial-gradient(60% 55% at 50% 82%, #f2c9a3 0 42%, transparent 43%),
    radial-gradient(52% 48% at 50% 34%, #ffe0b8 0 60%, transparent 61%),
    conic-gradient(from 200deg at 50% 34%, #d9a45f, #b9793a, #e8bd7c, #c98c46);
  box-shadow: 0 0 26px rgba(56,189,248,.28), inset 0 -8px 18px rgba(0,0,0,.35);
}
.who h1 { font-size: 27px; font-weight: 700; letter-spacing: .2px; line-height: 1.1; }
.who p  { font-size: 14.5px; color: var(--ink-mute); font-weight: 500; margin-top: 1px; }

.status { display: flex; align-items: center; gap: 18px; color: var(--ink-soft); }
.status .clock { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .4px; }
.status svg { width: 22px; height: 22px; opacity: .85; }
.batt { width: 30px; height: 15px; border: 1.6px solid rgba(190,210,245,.7); border-radius: 4px; position: relative; }
.batt::after { content: ""; position: absolute; top: 2px; left: 2px; bottom: 2px; width: 62%; border-radius: 2px; background: #5fd97a; }
.batt::before { content: ""; position: absolute; right: -4px; top: 4px; bottom: 4px; width: 2.5px; border-radius: 0 2px 2px 0; background: rgba(190,210,245,.7); }

/* ============================================================
   Die Wand
   ============================================================ */

/* Bewusst ohne z-index UND ohne perspective: beides würde hier einen
   Stapelkontext aufmachen, und das fliegende Fach käme nicht über den
   Vorhang. Die Perspektive für den Deckel sitzt am Fach selbst. */
.wall-wrap {
  position: relative;
  display: grid; place-items: center;
  /* Der Rand ist kein Verschnitt: dort steht das Blattwerk, in dem die
     Bewohner sitzen. Ohne ihn steht das Regal im Nichts. */
  padding: 20px clamp(56px, 7.5vw, 150px);
}

.wall {
  --cols: 3; --rows: 2;
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  grid-template-rows: repeat(var(--rows), 1fr);
  gap: var(--gap);
}

/* ---- ein Fach ---- */

/* Die übrigen Fächer werden nicht einzeln ausgeblendet — der Vorhang legt
   sich über sie. Das spart fünf Ebenen pro Fahrt. */
.bay { position: relative; aspect-ratio: var(--vw) / var(--vh); }

.bay-box {
  position: absolute; inset: 0;
  border-radius: 16px;
  /* Perspektive sitzt hier, nicht weiter oben: so schwingt der Deckel
     räumlich auf und bleibt trotzdem sauber über dem Innenraum. */
  perspective: 1400px;
  /* Korpus: außen kühler Lack, innen Tiefe */
  background: linear-gradient(168deg, var(--shell) 0%, var(--shell-lo) 62%, #071734 100%);
  box-shadow:
    0 34px 60px -22px rgba(0,0,0,.85),
    0 0 0 1px rgba(120,180,255,.16),
    inset 0 0 0 1px rgba(150,205,255,.10),
    inset 0 2px 0 rgba(190,225,255,.22);
  /* Nur transform und Radius werden bewegt. Ein animierter Schatten würde
     jedes Bild der Fahrt neu zeichnen lassen — er wird stattdessen
     zu Beginn abgeschaltet. */
  transform-origin: 0 0;
  transition: transform var(--t-dolly) var(--dolly), border-radius .3s var(--ease);
}
.bay.open .bay-box { border-radius: 0; box-shadow: none; }
.bay.flying { z-index: 60; }

/* Innenraum — hier wohnt der Desktop.
   Bewusst deckungsgleich mit dem Korpus: nur so ist die Geometrie beim
   Hineinfahren exakt, ohne dass unterwegs etwas verrutscht. Der sichtbare
   Rahmen kommt von .rim und wird beim Öffnen einfach weggeblendet. */
.bay-inner {
  position: absolute; inset: 0;
  border-radius: 16px;
  overflow: hidden;
  background: #060d20;
  transition: border-radius .3s var(--ease);
}
.bay.open .bay-inner { border-radius: 0; }

.rim {
  position: absolute; inset: 0; z-index: 4; pointer-events: none;
  border-radius: 16px;
  box-shadow:
    inset 0 0 0 9px #0d2450,
    inset 0 0 0 10px rgba(150,205,255,.18),
    inset 0 0 0 11px rgba(4,10,26,.9),
    inset 0 2px 0 rgba(190,225,255,.22),
    inset 0 16px 34px rgba(0,0,0,.6);
  transition: opacity .5s var(--dolly);
}
.bay.open .rim { opacity: 0; }

/* Der Desktop: eine Bühne fester Größe, mittig ins Fach skaliert */
.screen {
  position: absolute; left: 50%; top: 50%;
  width: calc(var(--sw) * 1px); height: calc(var(--sh) * 1px);
  transform: translate(-50%, -50%) scale(var(--k, .25));
  pointer-events: none;
}
.bay.open .screen { pointer-events: auto; }

/* warmes Licht, das aus dem Fach quillt */
.spill {
  position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: 16px;
  background:
    radial-gradient(120% 78% at 50% 108%, rgba(255,200,61,.30), transparent 62%),
    linear-gradient(180deg, rgba(4,10,26,.62), transparent 46%);
  opacity: 1; transition: opacity .5s var(--ease);
}
.bay.open .spill { opacity: 0; }

/* ---- der Deckel ---- */

.lid {
  position: absolute; left: -2px; right: -2px; top: -2px;
  height: calc(100% + 4px);
  transform-origin: 50% 0;
  transform: rotateX(-5deg);
  transform-style: preserve-3d;
  transition: transform var(--t-lid) var(--lid), opacity .3s linear .34s;
  z-index: 5;
  border-radius: 17px;
  overflow: hidden;
  /* Der Deckel zeigt, was drin wohnt: das gemalte Bild der Welt, darüber
     die Farbe des Fachs. Deshalb sind sechs Fächer auch sechs Orte und
     nicht sechs Kisten. */
  background: var(--tint);
  box-shadow:
    0 30px 52px -16px rgba(0,0,0,.85),
    inset 0 0 0 1px rgba(255,255,255,.14),
    inset 0 2px 0 rgba(255,255,255,.22);
  backface-visibility: hidden;
}

.lid-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lid-wash { /* Farbfeld links, Bild rechts — wie im Entwurf */
  position: absolute; inset: 0;
  background:
    linear-gradient(94deg, var(--tint) 0%, var(--tint) 24%, rgba(0,0,0,0) 64%),
    linear-gradient(0deg, rgba(3,8,18,.5) 0%, rgba(3,8,18,0) 42%);
}
.bay:hover .lid, .bay.peek .lid, .bay:focus-within .lid { transform: rotateX(-26deg); }
.bay.open .lid { transform: rotateX(-118deg); opacity: 0; }

/* Lichtspalt unter der Deckelkante — bleibt an der Fachkante, auch wenn
   der Deckel sich hebt; dann quillt mehr Licht heraus. */
.bay-box::after {
  content: ""; position: absolute; left: 7%; right: 7%; bottom: -3px; height: 7px;
  border-radius: 7px; z-index: 4; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255,200,61,.8), transparent);
  filter: blur(3px); opacity: .55;
  transition: opacity .3s var(--ease);
}
.bay:hover .bay-box::after, .bay.peek .bay-box::after { opacity: 1; }
.bay.open .bay-box::after { opacity: 0; }

/* Name und Zeichen sitzen unten links im Bild — das Bild bleibt Bild */
.lid-face {
  position: absolute; left: 8%; right: 8%; bottom: 9%;
  display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
}
.lid-face .glyph { color: #fff; filter: drop-shadow(0 2px 8px rgba(0,0,0,.5)); }
.lid-face .glyph svg { width: 38px; height: 38px; display: block; stroke-width: 1.7; }
.lid-face h2 {
  font-size: 33px; font-weight: 500; letter-spacing: .1px; line-height: 1;
  text-shadow: 0 2px 16px rgba(0,0,0,.55);
}

/* Scharniere: nur angedeutet, sonst erschlagen sie das Bild */
.hinge {
  position: absolute; top: -3px; width: 40px; height: 7px; z-index: 6;
  border-radius: 0 0 4px 4px;
  background: linear-gradient(180deg, #1a2740, #0a1220);
  box-shadow: inset 0 1px 0 rgba(180,210,255,.22);
  opacity: .8;
}
.hinge.l { left: 20%; } .hinge.r { right: 20%; }
.bay.open .hinge { opacity: 0; transition: opacity .25s linear; }

.bay-hit { position: absolute; inset: 0; z-index: 7; border-radius: 16px; }
.bay.open .bay-hit, .room.zoomed .bay-hit { pointer-events: none; }

/* ============================================================
   Leiste unten
   ============================================================ */

.dock {
  position: relative; z-index: 4;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 42px 26px;
}
.room.zoomed .dock { pointer-events: none; }

.dock-mid { display: flex; align-items: center; gap: 10px; }
.dbtn {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 48px; padding: 11px 18px; border-radius: 999px;
  color: var(--ink-soft); font-size: 15px; font-weight: 600;
  transition: background .16s, color .16s;
}
.dbtn svg { width: 22px; height: 22px; }
.dbtn:hover { background: rgba(255,255,255,.09); color: #fff; }
.dbtn.on { color: var(--cyan); }
.dbtn.gate {
  background: rgba(255,255,255,.07);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
}

/* ============================================================
   Der Desktop im Fach (logische Bühne 1400×788)
   ============================================================ */

.screen-bg { position: absolute; inset: 0; }
.screen-bg canvas { width: 100%; height: 100%; display: block; }
.screen-bg::after { /* die Kulisse bleibt Kulisse — Inhalt zuerst */
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(4,9,24,.9) 0%, rgba(4,9,24,.74) 34%, rgba(4,9,24,.95) 100%),
    linear-gradient(98deg, rgba(4,9,24,.9) 0%, rgba(4,9,24,.34) 62%);
}
/* … in der Farbe ihres Fachs: drinnen ist man in derselben Welt,
   die vorher auf dem Deckel zu sehen war */
.screen-tint {
  position: absolute; inset: 0; opacity: .42;
  background: linear-gradient(98deg, var(--tint) 0%, rgba(0,0,0,0) 62%);
}

.dsk { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 34px 56px 0; }

.dsk-top { display: flex; align-items: center; justify-content: space-between; flex: none; }
.dsk-top .who h1 { font-size: 21px; }
.dsk-top .who p { font-size: 12.5px; }
.dsk-top .avatar { width: 44px; height: 44px; }
.dsk-top .status .clock { font-size: 16px; }
.dsk-top .status svg { width: 17px; height: 17px; }
.dsk-top .batt { width: 24px; height: 12px; }

.dsk-head { flex: none; margin: 26px 0 4px; }
.dsk-head h2 { font-size: 46px; font-weight: 700; letter-spacing: -.6px; }
.dsk-head p { font-size: 17px; color: var(--ink-soft); font-weight: 500; margin-top: 4px; }

.dsk-body { flex: 1; overflow: hidden; padding-top: 22px; display: flex; flex-direction: column; gap: 26px; }

.sec-title { font-size: 15px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 13px; }

/* Karten mit gemaltem Motiv */
.row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.row.n3 { grid-template-columns: repeat(3, 1fr); }
.card {
  position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden;
  box-shadow: 0 16px 30px -14px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.10);
  transition: transform .22s var(--ease), box-shadow .22s var(--ease);
}
.card:hover { transform: translateY(-4px); box-shadow: 0 22px 38px -14px rgba(0,0,0,.85), inset 0 0 0 1px rgba(120,200,255,.4); }
.card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .cap {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 16px 14px; text-align: left;
  background: linear-gradient(180deg, transparent, rgba(3,8,20,.9) 62%);
}
.card .cap b { display: block; font-size: 17px; font-weight: 700; }
.card .cap span { display: block; font-size: 13px; color: var(--ink-soft); font-weight: 500; margin-top: 2px; }
.bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.2); margin-top: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--cyan); }

/* App-Kacheln */
.tiles { display: flex; gap: 16px; flex-wrap: wrap; }
.tile {
  width: 132px; padding: 16px 10px 13px; border-radius: 16px; text-align: center;
  background: rgba(255,255,255,.055);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.13);
  transition: background .18s, transform .18s var(--ease);
}
.tile:hover { background: rgba(255,255,255,.12); transform: translateY(-3px); }
.tile .ti { width: 46px; height: 46px; margin: 0 auto 10px; display: grid; place-items: center; border-radius: 13px; }
.tile .ti svg { width: 26px; height: 26px; }
.tile b { display: block; font-size: 14px; font-weight: 600; }
.tile span { display: block; font-size: 11.5px; color: var(--ink-mute); margin-top: 2px; }

/* Kategorie-Pillen */
.chips { display: flex; gap: 13px; flex-wrap: wrap; }
.chip {
  padding: 12px 26px; border-radius: 12px; font-size: 14.5px; font-weight: 600; color: var(--ink-soft);
  background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.13);
  transition: background .16s, color .16s;
}
.chip:hover { background: rgba(255,255,255,.13); color: #fff; }
.chip.on { color: #fff; box-shadow: inset 0 0 0 1px rgba(56,189,248,.6); background: rgba(56,189,248,.15); }

/* Bücher */
.shelf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.book {
  display: flex; gap: 14px; padding: 14px; border-radius: 14px; text-align: left;
  background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
  transition: background .18s, transform .18s var(--ease);
}
.book:hover { background: rgba(255,255,255,.1); transform: translateY(-3px); }
.book canvas { width: 62px; height: 86px; border-radius: 6px; flex: none; box-shadow: 0 6px 14px rgba(0,0,0,.5); }
.book b { display: block; font-size: 14.5px; font-weight: 700; line-height: 1.25; }
.book span { display: block; font-size: 12px; color: var(--ink-mute); margin-top: 3px; }
.book em { display: block; font-style: normal; font-size: 14px; font-weight: 700; color: var(--gold); margin-top: 10px; }

/* Fußleiste des Desktops */
.dsk-foot {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0 20px; margin-top: auto;
}

/* ============================================================
   Vordergrund — Blattwerk und Bewohner, über der Wand
   ============================================================ */

#fg {
  position: absolute; inset: 0; z-index: 3;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* ============================================================
   Zurückhaltung, wenn gewünscht
   ============================================================ */

/* Wer weniger Bewegung eingestellt hat, bekommt denselben Weg — nur kurz:
   das Fach ist trotzdem da, wo es hingehört. */
@media (prefers-reduced-motion: reduce) {
  :root { --t-lid: 1ms; --t-dolly: 200ms; --dolly: linear; }
  .card:hover, .tile:hover, .book:hover { transform: none; }
  .critter .eye { animation: none; }
}

@media (max-width: 900px) {
  .wall { --cols: 2; --rows: 3; }
  .lid-face h2 { font-size: 26px; }
  .lid-face .glyph { width: 60px; height: 60px; }
}
</style>
</head>
<body>

<div class="room" id="room">
  <canvas id="sky"></canvas>
  <canvas id="fg" aria-hidden="true"></canvas>

  <header class="hud">
    <div class="who">
      <div class="avatar"></div>
      <div>
        <h1 id="kidName">Jake</h1>
        <p>Willkommen zurück</p>
      </div>
    </div>
    <div class="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M2 8.8a16 16 0 0 1 20 0M5 12.4a11 11 0 0 1 14 0M8.5 16a6 6 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.1" fill="currentColor" stroke="none"/></svg>
      <span class="clock" id="clock">19:45</span>
      <span class="batt"></span>
    </div>
  </header>

  <div class="wall-wrap">
    <div class="wall" id="wall"></div>
  </div>

  <div class="scrim"></div>

  <nav class="dock">
    <button class="dbtn" data-act="power">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3.5v8"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
      Ausschalten
    </button>
    <div class="dock-mid">
      <button class="dbtn" data-act="search" aria-label="Suchen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
      <button class="dbtn on" data-act="home" aria-label="Startseite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3.5 10.5 12 3.6l8.5 6.9V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/></svg>
      </button>
      <button class="dbtn" data-act="peek" id="peekBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M8 3.5l-1.5 2.5M16 3.5l1.5 2.5"/></svg>
        Alle Deckel
      </button>
    </div>
    <button class="dbtn gate" data-act="gate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
      Elternbereich
    </button>
  </nav>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   Symbole
   ============================================================ */
const S = (d, extra = '') =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;

/* ============================================================
   Bildwelten — jede Kachel wird gemalt, keine Dateien nötig
   ============================================================ */

const mulberry = (a) => () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

const PAL = {

  aurora:  { sky: ['#0f3f5e', '#050f26'], glow: 'rgba(110,255,190,.5)',  ridge: ['#0c2942', '#061626'],            water: '#08243c', stars: 1 },

function paint(cv, key, seed, w, h) {
  const p = PAL[key] || PAL.castle;
  const dpr = 1.6;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  const r = mulberry(seed);

  let g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, p.sky[0]); g.addColorStop(1, p.sky[1]);
  c.fillStyle = g; c.fillRect(0, 0, w, h);

  if (p.stars) {
    const n = 26 * p.stars;
    for (let i = 0; i < n; i++) {
      const x = r() * w, y = r() * h * .72, s = r() * 1.3 + .3;
      c.globalAlpha = .25 + r() * .6;
      c.fillStyle = r() > .82 ? '#ffe6a8' : '#ffffff';
      c.beginPath(); c.arc(x, y, s, 0, 6.284); c.fill();
    }
    c.globalAlpha = 1;
  }

  const ox = w * (.18 + r() * .64), oy = h * (.1 + r() * .26), orad = h * (.62 + r() * .6);
  g = c.createRadialGradient(ox, oy, 0, ox, oy, orad);
  g.addColorStop(0, p.glow); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);

  const horizon = h * (p.water ? .62 : .76);
  p.ridge.forEach((col, i) => {
    const base = horizon - (p.ridge.length - 1 - i) * h * .07;
    const amp = h * (.3 - i * .06);
    c.fillStyle = col;
    c.beginPath(); c.moveTo(0, h);
    let y = base - r() * amp * .4;
    for (let x = 0; x <= w + 24; x += w / 7) {
      const ny = base - Math.abs(Math.sin(x * (.7 + i) / w * 3 + seed)) * amp * (.5 + r() * .7);
      c.quadraticCurveTo(x - w / 14, (y + ny) / 2 - amp * .12, x, ny);
      y = ny;
    }
    c.lineTo(w, h); c.closePath(); c.fill();
  });

  if (p.water) {
    c.fillStyle = p.water; c.fillRect(0, horizon, w, h - horizon);

    // Spiegelung des Lichts — weich auslaufend, damit kein Balken entsteht
    c.save();
    c.beginPath(); c.rect(0, horizon, w, h - horizon); c.clip();
    g = c.createRadialGradient(ox, horizon, 0, ox, horizon, Math.max(w, h) * .42);
    g.addColorStop(0, 'rgba(255,255,255,.24)');
    g.addColorStop(.55, 'rgba(255,255,255,.06)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, horizon, w, h - horizon);

    // ein paar Kräusel, kurz und leise
    c.lineCap = 'round';
    for (let i = 0; i < 9; i++) {
      const t = i / 9;
      const y = horizon + (h - horizon) * (t * t * .95 + .05);
      const len = w * (.06 + r() * .16) * (1 - t * .4);
      const x = ox + (r() - .5) * w * .5 - len / 2;
      c.strokeStyle = `rgba(255,255,255,${(.16 - t * .1).toFixed(3)})`;
      c.lineWidth = Math.max(1, (h - horizon) * .022);
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + len, y); c.stroke();
    }
    c.restore();

    // Horizontkante
    g = c.createLinearGradient(0, horizon - h * .03, 0, horizon + h * .02);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(.7, 'rgba(255,255,255,.13)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, horizon - h * .03, w, h * .05);
  }

  g = c.createRadialGradient(w / 2, h * .45, h * .2, w / 2, h * .5, h * 1.1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(2,5,14,.55)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
}

/* ============================================================
   Die sechs Welten

   Jedes Fach ist ein eigener Ort mit eigener Farbe — das ist der
   Unterschied zwischen sechs Kisten und sechs Türen. Gemalt, nicht
   geladen: ein Kristall über dem See, ein Torbogen mit Licht dahinter,
   eine Regalwand, ein Schreibtisch mit Lampe, eine Burg am Fluss, ein
   Höhlenausgang in den Wald.
   ============================================================ */

const lin = (c, x0, y0, x1, y1, stops) => {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  return g;
};
const rad = (c, x, y, r0, r1, stops) => {
  const g = c.createRadialGradient(x, y, r0, x, y, r1);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  return g;
};
function glow(c, x, y, r0, col) {
  c.fillStyle = rad(c, x, y, 0, r0, [[0, col], [1, 'rgba(0,0,0,0)']]);
  c.beginPath(); c.arc(x, y, r0, 0, 6.284); c.fill();
}
function speckle(c, w, h, n, rnd, maxY, cols) {
  for (let i = 0; i < n; i++) {
    const x = rnd() * w, y = rnd() * (maxY || h), s = rnd() * 1.4 + .25;
    c.globalAlpha = .2 + rnd() * .65;
    c.fillStyle = cols[(rnd() * cols.length) | 0];
    c.beginPath(); c.arc(x, y, s, 0, 6.284); c.fill();
  }
  c.globalAlpha = 1;
}
function hills(c, w, h, baseY, amp, col, rnd, phase) {
  c.fillStyle = col;
  c.beginPath(); c.moveTo(-4, h);
  let y = baseY;
  for (let x = -4; x <= w + 30; x += w / 6) {
    const ny = baseY - Math.abs(Math.sin(x / w * 2.4 + phase)) * amp * (.55 + rnd() * .6);
    c.quadraticCurveTo(x - w / 12, (y + ny) / 2 - amp * .18, x, ny);
    y = ny;
  }
  c.lineTo(w + 30, h); c.closePath(); c.fill();
}
function conifer(c, x, base, hgt, col) {
  c.fillStyle = col;
  for (let i = 0; i < 3; i++) {
    const t = i / 3, y = base - hgt * t, wd = hgt * .34 * (1 - t * .55);
    c.beginPath();
    c.moveTo(x, y - hgt * .42); c.lineTo(x + wd, y); c.lineTo(x - wd, y);
    c.closePath(); c.fill();
  }
}

const WORLD = {
  /* Spielen — Kristall über dem stillen See */
  spielen(c, w, h, r) {
    c.fillStyle = lin(c, 0, 0, 0, h, [[0, '#31459b'], [.5, '#1b2a66'], [1, '#0b1234']]);
    c.fillRect(0, 0, w, h);
    speckle(c, w, h * .7, 40, r, h * .66, ['#ffffff', '#cfe0ff', '#ffe9bb']);
    glow(c, w * .66, h * .48, h * .78, 'rgba(130,180,255,.34)');
    hills(c, w, h, h * .6, h * .17, '#22306f', r, 1.2);
    hills(c, w, h, h * .66, h * .1, '#18234f', r, 2.6);

    const water = h * .7;
    c.fillStyle = lin(c, 0, water, 0, h, [[0, '#16255c'], [1, '#0c1538']]);
    c.fillRect(0, water, w, h - water);

    // Kristall
    const cx = w * .68, cy = water + h * .02, ch = h * .46, cw = h * .1;
    const shard = (dir) => {
      c.beginPath();
      c.moveTo(cx, cy - dir * ch);
      c.lineTo(cx + cw, cy - dir * ch * .42);
      c.lineTo(cx + cw * .5, cy);
      c.lineTo(cx - cw * .5, cy);
      c.lineTo(cx - cw, cy - dir * ch * .42);
      c.closePath();
    };
    c.globalAlpha = .3; shard(-1);
    c.fillStyle = lin(c, cx, cy, cx, cy + ch, [[0, '#9fd8ff'], [1, 'rgba(159,216,255,0)']]);
    c.fill(); c.globalAlpha = 1;

    glow(c, cx, cy - ch * .5, ch * .95, 'rgba(150,220,255,.4)');
    shard(1);
    c.fillStyle = lin(c, cx - cw, cy - ch, cx + cw, cy, [[0, '#e8f6ff'], [.45, '#8fc6f5'], [1, '#3f6fc4']]);
    c.fill();
    c.strokeStyle = 'rgba(230,246,255,.75)'; c.lineWidth = Math.max(1, h * .006);
    c.beginPath(); c.moveTo(cx, cy - ch); c.lineTo(cx, cy); c.stroke();

    c.fillStyle = '#101c4a';                       // die Klippe, auf der er steht
    c.beginPath(); c.ellipse(cx, cy + h * .015, cw * 1.9, h * .026, 0, 0, 6.284); c.fill();
    c.fillStyle = '#080d26';
    c.beginPath(); c.ellipse(w * .1, h * 1.03, w * .3, h * .16, 0, 0, 6.284); c.fill();
  },

  /* Apps — Torbogen, dahinter brennt Licht */
  apps(c, w, h, r) {
    c.fillStyle = lin(c, 0, 0, 0, h, [[0, '#1d6f74'], [.55, '#0d434c'], [1, '#062028']]);
    c.fillRect(0, 0, w, h);
    glow(c, w * .68, h * .62, h * .8, 'rgba(255,214,140,.2)');
    hills(c, w, h, h * .62, h * .12, '#0c3d45', r, .6);

    const bx = w * .5, bw = w * .42, by = h * .18, bh = h * .64;
    const slab = (x, y, ww, hh, col, lip) => {
      c.fillStyle = col; c.fillRect(x, y, ww, hh);
      c.fillStyle = lip; c.fillRect(x, y, ww, Math.max(2, h * .016));   // Lichtkante oben
      c.fillStyle = 'rgba(2,14,18,.5)'; c.fillRect(x, y, ww * .12, hh); // Schattenseite
    };
    slab(bx + bw * .04, by + bh * .08, bw * .92, bh * .92, '#07333b', 'rgba(160,225,220,.24)');
    slab(bx - bw * .06, by + bh * .34, bw * 1.14, bh * .66, '#0c4753', 'rgba(190,245,240,.4)');
    slab(bx + bw * .16, by, bw * .54, bh * .36, '#052a31', 'rgba(150,220,215,.32)');
    c.fillStyle = 'rgba(3,20,25,.55)';                                  // Sockelstufen
    c.fillRect(bx - bw * .16, by + bh * .94, bw * 1.34, h * .03);
    c.fillRect(bx - bw * .24, by + bh * .99, bw * 1.5, h * .03);

    // Bogen
    const ax = bx + bw * .42, aw = bw * .3, ay = by + bh * .42, ah = bh * .58;
    c.save();
    c.beginPath();
    c.moveTo(ax, ay + ah);
    c.lineTo(ax, ay + aw * .5);
    c.arc(ax + aw / 2, ay + aw * .5, aw / 2, Math.PI, 0);
    c.lineTo(ax + aw, ay + ah);
    c.closePath();
    c.clip();
    c.fillStyle = lin(c, ax, ay, ax, ay + ah, [[0, '#fff0c2'], [.5, '#ffc873'], [1, '#e08a3c']]);
    c.fillRect(ax, ay, aw, ah);
    c.restore();
    glow(c, ax + aw / 2, ay + ah * .55, aw * 2.3, 'rgba(255,200,110,.4)');

    // Wasser mit Spiegelung
    const water = h * .82;
    c.fillStyle = lin(c, 0, water, 0, h, [[0, '#0b3b44'], [1, '#062229']]);
    c.fillRect(0, water, w, h - water);
    c.fillStyle = lin(c, 0, water, 0, h, [[0, 'rgba(255,200,110,.5)'], [1, 'rgba(255,200,110,0)']]);
    c.fillRect(ax, water, aw, h - water);
    c.globalAlpha = .5; c.strokeStyle = 'rgba(200,240,235,.35)'; c.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const y = water + (h - water) * (i / 5) + 2;
      c.beginPath(); c.moveTo(ax - aw * (.4 + r()), y); c.lineTo(ax + aw * (1 + r()), y); c.stroke();
    }
    c.globalAlpha = 1;
  },

  /* Bibliothek — Regalwand mit warmer Nische */
  bibliothek(c, w, h, r) {
    c.fillStyle = lin(c, 0, 0, 0, h, [[0, '#54398f'], [1, '#1d1140']]);
    c.fillRect(0, 0, w, h);
    glow(c, w * .82, h * .62, h * .8, 'rgba(255,196,120,.3)');

    // Regale
    const x0 = w * .34, x1 = w * .78, top = h * .1, bot = h * .86;
    c.fillStyle = '#2b1c56'; c.fillRect(x0, top, x1 - x0, bot - top);
    const shelves = 4, sh = (bot - top) / shelves;
    for (let s = 0; s < shelves; s++) {
      const y = top + s * sh;
      c.fillStyle = '#1d1140'; c.fillRect(x0, y + sh - h * .022, x1 - x0, h * .022);
      let x = x0 + w * .012;
      while (x < x1 - w * .02) {
        const bw2 = w * (.008 + r() * .014);
        const bh2 = sh * (.5 + r() * .3);
        const hue = r();
        c.fillStyle = hue > .72 ? '#d9a05c' : hue > .45 ? '#7f6ac0' : hue > .2 ? '#4d8ec4' : '#b4667f';
        c.globalAlpha = .55 + r() * .45;
        c.fillRect(x, y + sh - h * .022 - bh2, bw2, bh2);
        c.globalAlpha = 1;
        x += bw2 + w * .003;
      }
    }
    // Nische
    const nx = w * .8, nw = w * .17, ny = h * .34, nh = h * .5;
    c.fillStyle = '#3a2865';
    c.beginPath();
    c.moveTo(nx, ny + nh); c.lineTo(nx, ny + nw * .5);
    c.arc(nx + nw / 2, ny + nw * .5, nw / 2, Math.PI, 0);
    c.lineTo(nx + nw, ny + nh); c.closePath(); c.fill();
    glow(c, nx + nw / 2, ny + nh * .72, nw * 1.9, 'rgba(255,198,118,.55)');
    c.fillStyle = '#6b4f96';
    c.beginPath(); c.ellipse(nx + nw / 2, ny + nh * .93, nw * .42, nh * .12, 0, 0, 6.284); c.fill();
    // Boden
    c.fillStyle = lin(c, 0, h * .86, 0, h, [[0, '#241553'], [1, '#180d38']]);
    c.fillRect(0, h * .86, w, h * .14);
  },

  /* Erschaffen — Tisch, Lampe, Stifte */
  erschaffen(c, w, h, r) {
    c.fillStyle = lin(c, 0, 0, 0, h, [[0, '#2a8792'], [.6, '#12626e'], [1, '#0a3a44']]);
    c.fillRect(0, 0, w, h);
    glow(c, w * .72, h * .52, h * .7, 'rgba(255,232,180,.34)');

    // Tischplatte
    const ty = h * .68;
    c.fillStyle = '#1d6d78';
    c.beginPath();
    c.moveTo(w * .3, ty); c.lineTo(w * 1.05, ty - h * .06);
    c.lineTo(w * 1.05, h * 1.05); c.lineTo(w * .18, h * 1.05);
    c.closePath(); c.fill();
    c.fillStyle = 'rgba(210,255,250,.16)';
    c.fillRect(w * .3, ty - h * .012, w * .75, h * .014);

    // Lampe
    const lx = w * .72, ly = ty - h * .16;
    c.fillStyle = '#0f4a54';
    c.fillRect(lx - w * .035, ly + h * .1, w * .07, h * .03);
    c.fillRect(lx - w * .008, ly + h * .05, w * .016, h * .06);
    glow(c, lx, ly, h * .5, 'rgba(255,235,175,.55)');
    c.fillStyle = rad(c, lx - h * .03, ly - h * .03, 0, h * .13, [[0, '#fffdf2'], [.6, '#ffe9b0'], [1, '#f0c877']]);
    c.beginPath(); c.arc(lx, ly, h * .11, 0, 6.284); c.fill();

    // Stiftebecher
    const cx = w * .48, cyy = ty - h * .04;
    const pencils = [[-.5, -.26], [-.2, -.34], [.1, -.3], [.35, -.22], [-.05, -.4]];
    pencils.forEach(([dx, dy], i) => {
      c.save();
      c.translate(cx + w * .03 * dx, cyy);
      c.rotate(dx * .5);
      c.fillStyle = ['#e8734a', '#f0b73c', '#5fb0d8', '#7f6ac0', '#e0e6ea'][i];
      c.fillRect(-w * .008, h * dy, w * .016, h * -dy + h * .02);
      c.fillStyle = '#2b2118';
      c.beginPath();
      c.moveTo(-w * .008, h * dy); c.lineTo(w * .008, h * dy); c.lineTo(0, h * dy - h * .035);
      c.closePath(); c.fill();
      c.restore();
    });
    c.fillStyle = '#bfe4e2';
    c.beginPath();
    c.moveTo(cx - w * .045, cyy - h * .12); c.lineTo(cx + w * .045, cyy - h * .12);
    c.lineTo(cx + w * .036, cyy); c.lineTo(cx - w * .036, cyy);
    c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)';
    c.fillRect(cx - w * .045, cyy - h * .12, w * .09, h * .012);

    // Buch flach
    c.fillStyle = '#12525c';
    c.fillRect(w * .3, ty + h * .1, w * .16, h * .035);
    c.fillStyle = '#2a8792';
    c.fillRect(w * .3, ty + h * .09, w * .16, h * .014);
  },

  /* Schauen — Burg am Fluss, spät */
  schauen(c, w, h, r) {
    c.fillStyle = lin(c, 0, 0, 0, h, [[0, '#24397a'], [.5, '#111f4c'], [1, '#070d24']]);
    c.fillRect(0, 0, w, h);
    speckle(c, w, h, 46, r, h * .6, ['#ffffff', '#bcd4ff', '#ffe6b0']);
    glow(c, w * .62, h * .5, h * .72, 'rgba(150,180,255,.26)');
    hills(c, w, h, h * .62, h * .1, '#16234f', r, 3.1);

    // Burg
    const bx = w * .56, base = h * .62;
    const tower = (x, wd, hgt) => {
      c.fillStyle = '#0d1636';
      c.fillRect(x - wd / 2, base - hgt, wd, hgt);
      c.beginPath();
      c.moveTo(x - wd * .72, base - hgt); c.lineTo(x + wd * .72, base - hgt);
      c.lineTo(x, base - hgt - wd * 1.5); c.closePath(); c.fill();
      for (let i = 0; i < 3; i++) {
        if (r() > .45) continue;
        c.fillStyle = 'rgba(255,206,130,.9)';
        c.fillRect(x - wd * .16, base - hgt * (.3 + i * .22), wd * .3, hgt * .07);
      }
    };
    glow(c, bx + w * .04, base - h * .2, h * .42, 'rgba(255,200,130,.22)');
    tower(bx - w * .08, w * .035, h * .2);
    tower(bx + w * .12, w * .03, h * .17);
    tower(bx + w * .02, w * .05, h * .34);
    c.fillStyle = '#0d1636';
    c.fillRect(bx - w * .11, base - h * .12, w * .26, h * .12);

    // Fluss
    const water = h * .62;
    c.fillStyle = lin(c, 0, water, 0, h, [[0, '#15254a'], [1, '#0a1130']]);
    c.fillRect(0, water, w, h - water);
    c.globalAlpha = .5;
    for (let i = 0; i < 12; i++) {
      const y = water + (h - water) * (i / 12);
      c.strokeStyle = i % 3 ? 'rgba(255,206,130,.35)' : 'rgba(190,215,255,.3)';
      c.lineWidth = Math.max(1, h * .008);
      const len = w * (.03 + r() * .1);
      const x = bx + (r() - .5) * w * .3;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + len, y); c.stroke();
    }
    c.globalAlpha = 1;
    c.fillStyle = '#070d24';
    conifer(c, w * .1, water + h * .04, h * .3, '#070d24');
    conifer(c, w * .04, water + h * .07, h * .24, '#070d24');
  },

  /* Entdecken — man steht im Dunkeln und schaut hinaus */
  entdecken(c, w, h, r) {
    // draußen: Wald im Gegenlicht
    c.fillStyle = lin(c, 0, 0, 0, h, [[0, '#f2ffe4'], [.3, '#a8dd97'], [.7, '#4c9c66'], [1, '#226b46']]);
    c.fillRect(0, 0, w, h);
    glow(c, w * .62, h * .26, h * .8, 'rgba(255,255,205,.75)');
    hills(c, w, h, h * .5, h * .16, '#63ab74', r, 1.9);
    hills(c, w, h, h * .62, h * .11, '#3a8a5c', r, 3.4);
    for (let i = 0; i < 22; i++) {
      const t = r();
      const x = w * (.28 + t * .68), b = h * (.55 + r() * .3);
      conifer(c, x, b, h * (.14 + r() * .22), b > h * .68 ? '#144a30' : '#1f6642');
    }
    c.fillStyle = '#d8cfa0';
    c.beginPath();
    c.moveTo(w * .42, h * 1.02); c.lineTo(w * .58, h * .66);
    c.lineTo(w * .64, h * .66); c.lineTo(w * .78, h * 1.02);
    c.closePath(); c.fill();
    c.fillStyle = '#20321f';                       // zwei, die schon draußen sind
    c.fillRect(w * .585, h * .70, w * .009, h * .048);
    c.fillRect(w * .607, h * .712, w * .008, h * .042);

    // Der Fels, in dem man steht: alles außerhalb der Öffnung. Die Kontur
    // ist bewusst unruhig und unten abgeflacht — ein runder Ausschnitt
    // sieht aus wie ein Ball, kein Höhlenausgang.
    const cx = w * .64, cy = h * .56, rx = w * .32, ry = h * .5;
    const floor = h * .97, N = 16;
    const mouth = [];
    for (let i = 0; i < N; i++) {
      const a = -Math.PI / 2 + (i / N) * Math.PI * 2;
      const n = .9 + Math.sin(i * 1.1 + .4) * .07 + Math.sin(i * 2.3) * .04;
      mouth.push([cx + Math.cos(a) * rx * n, Math.min(floor, cy + Math.sin(a) * ry * n)]);
    }
    // weich durch die Stützpunkte, sonst wird aus der Höhle ein Stern
    const mid = (i) => [
      (mouth[i][0] + mouth[(i + 1) % N][0]) / 2,
      (mouth[i][1] + mouth[(i + 1) % N][1]) / 2
    ];
    const traceMouth = () => {
      const s = mid(N - 1);
      c.moveTo(s[0], s[1]);
      for (let i = 0; i < N; i++) {
        const e = mid(i);
        c.quadraticCurveTo(mouth[i][0], mouth[i][1], e[0], e[1]);
      }
      c.closePath();
    };

    c.beginPath();
    c.rect(0, 0, w, h);
    traceMouth();
    c.fillStyle = '#030b07'; c.fill('evenodd');

    c.beginPath(); traceMouth();                       // Lichtsaum an der Kante
    c.strokeStyle = 'rgba(190,245,190,.22)'; c.lineWidth = Math.max(1.5, h * .012);
    c.stroke();

    // Moos auf der oberen Felskante, dem Ausschnitt folgend
    mouth.forEach(([x, y], i) => {
      if (i > N * .45 && i < N * .9) return;              // nur oben herum
      for (let k = 0; k < 3; k++) {
        c.fillStyle = k ? '#12321f' : '#20512f';
        c.beginPath();
        c.ellipse(x + (r() - .5) * w * .05, y - h * .01 + (r() - .5) * h * .03,
          h * (.012 + r() * .02), h * (.008 + r() * .012), r() * 3, 0, 6.284);
        c.fill();
      }
    });

    // Steine im Dunkeln, direkt vor den Füßen
    c.fillStyle = '#020806';
    c.beginPath(); c.ellipse(w * .12, h * 1.04, w * .32, h * .18, 0, 0, 6.284); c.fill();
    c.beginPath(); c.ellipse(w * .82, h * 1.06, w * .26, h * .14, 0, 0, 6.284); c.fill();
  }
};

function paintWorld(cv, key, w, h, seed) {
  const dpr = 1.5;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  (WORLD[key] || WORLD.spielen)(c, w, h, mulberry(seed || 7));
}

function cardMarkup(it, w, h) {
  const prog = it.pct != null ? `<div class="bar"><i style="width:${it.pct}%"></i></div>` : '';
  const meta = it.meta ? `<span>${esc(it.meta)}</span>` : '';
  return `<button class="card" data-scene="${it.scene}" data-w="${w}" data-h="${h}">
      <canvas aria-hidden="true"></canvas>
      <span class="cap"><b>${esc(it.name)}</b>${meta}${prog}</span>

function sectionMarkup(sec) {
  const head = sec.title ? `<div class="sec-title">${esc(sec.title)}</div>` : '';
  if (sec.kind === 'cards') {
    const n = sec.n || 4;
    const w = n === 3 ? 420 : 308, h = Math.round(w * 10 / 16);
    return `<section>${head}<div class="row${n === 3 ? ' n3' : ''}">
      ${sec.items.map((it) => cardMarkup(it, w, h)).join('')}</div></section>`;
  }
  if (sec.kind === 'tiles') {
    return `<section>${head}<div class="tiles">${sec.items.map((it) => `
      <button class="tile">
        <span class="ti" style="background:${it.tint}22; box-shadow: inset 0 0 0 1px ${it.tint}66; color:${it.tint}">${ICON[it.icon] || ICON.cube}</span>
        <b>${esc(it.name)}</b><span>${esc(it.hint || '')}</span>
      </button>`).join('')}</div></section>`;
  }
  if (sec.kind === 'chips') {
    return `<section>${head}<div class="chips">${sec.items.map((t, i) =>
      `<button class="chip${i === 0 && !sec.title ? ' on' : ''}">${esc(t)}</button>`).join('')}</div></section>`;
  }
  if (sec.kind === 'books') {
    return `<section>${head}<div class="shelf">${sec.items.map((b) => `
      <button class="book">
        <canvas data-scene="${b.scene}" data-w="62" data-h="86" aria-hidden="true"></canvas>

  }
  return '';
}

const sky = document.getElementById('sky');
function paintSky() {
  const w = sky.width = innerWidth, h = sky.height = innerHeight;
  const c = sky.getContext('2d');
  let g = c.createLinearGradient(0, 0, w * .3, h);
  g.addColorStop(0, '#0a1c44'); g.addColorStop(.55, '#061128'); g.addColorStop(1, '#03071a');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  g = c.createRadialGradient(w * .5, h * .3, 0, w * .5, h * .3, h * 1.1);
  g.addColorStop(0, 'rgba(40,110,220,.24)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const r = mulberry(7);
  for (let i = 0; i < 160; i++) {
    const x = r() * w, y = r() * h, s = r() * 1.5 + .2;
    c.globalAlpha = .15 + r() * .7;
    c.fillStyle = r() > .85 ? '#ffd9a0' : (r() > .6 ? '#a8d8ff' : '#ffffff');
    c.beginPath(); c.arc(x, y, s, 0, 6.284); c.fill();
  }
  c.globalAlpha = 1;
}
paintSky();

/* ============================================================
   Der Vordergrund: Blattwerk am Bildrand, und wer darin wohnt.
   Das Regal steht nicht im Nichts, sondern im Habitat — genau das
   macht den Unterschied zwischen einem Menü und einem Ort.
   ============================================================ */

const fgc = document.getElementById('fg');

function leaves(c, x, y, s, rnd, n, accent) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.284, d = rnd() * s;
    const lx = x + Math.cos(a) * d * 1.15, ly = y + Math.sin(a) * d * .85;
    const len = s * (.16 + rnd() * .2), wid = len * (.3 + rnd() * .24);
    c.save(); c.translate(lx, ly); c.rotate(rnd() * 6.284);
    c.fillStyle = rnd() > .82 ? accent : (rnd() > .5 ? '#04100c' : '#071a14');
    c.beginPath(); c.ellipse(0, 0, len, wid, 0, 0, 6.284); c.fill();
    c.restore();
  }
}

function beast(c, x, y, s, body, ears) {
  c.fillStyle = body;
  if (ears === 'lang') {                       // Langohr
    [-1, 1].forEach((d) => {
      c.save(); c.translate(x + s * .42 * d, y - s * .5); c.rotate(d * .28);
      c.beginPath(); c.ellipse(0, 0, s * .17, s * .62, 0, 0, 6.284); c.fill();
      c.restore();
    });
  } else if (ears === 'spitz') {               // Spitzohr
    [-1, 1].forEach((d) => {
      c.beginPath();
      c.moveTo(x + s * .58 * d, y - s * .3);
      c.lineTo(x + s * .8 * d, y - s * 1.12);
      c.lineTo(x + s * .16 * d, y - s * .62);
      c.closePath(); c.fill();
    });
  }
  c.beginPath(); c.ellipse(x, y, s * .82, s * .74, 0, 0, 6.284); c.fill();

  [-.32, .32].forEach((d) => {
    glow(c, x + s * d, y - s * .06, s * .62, 'rgba(255,214,130,.3)');
    c.fillStyle = '#ffe6a8';
    c.beginPath(); c.ellipse(x + s * d, y - s * .06, s * .2, s * .21, 0, 0, 6.284); c.fill();
    c.fillStyle = '#1c1408';
    c.beginPath(); c.arc(x + s * d + s * .04, y - s * .04, s * .085, 0, 6.284); c.fill();
  });
}

function paintFg() {
  const dpr = 1.5;
  const w = innerWidth, h = innerHeight;
  fgc.width = Math.round(w * dpr); fgc.height = Math.round(h * dpr);
  const c = fgc.getContext('2d');
  c.scale(dpr, dpr);
  const r = mulberry(4242);

  // Blattwerk bleibt am Rand: die Ballen sitzen halb außerhalb des Bildes,
  // sichtbar ist nur die Kante, die ins Bild ragt.
  leaves(c, -h * .04, h * .5,  h * .17, r, 40, '#0e3527');
  leaves(c, h * .02,  h * .92, h * .15, r, 30, '#11402c');
  leaves(c, -h * .05, h * .16, h * .12, r, 22, '#0c2c20');
  beast(c, h * .052, h * .66, h * .027, '#0a1a16', 'spitz');

  leaves(c, w + h * .04, h * .44, h * .18, r, 42, '#0e3527');
  leaves(c, w - h * .02, h * .94, h * .15, r, 30, '#11402c');
  leaves(c, w + h * .05, h * .12, h * .13, r, 24, '#0c2c20');
  beast(c, w - h * .055, h * .56, h * .025, '#0b1712', 'lang');
  beast(c, w - h * .022, h * .27, h * .02, '#0a1a16', 'spitz');

  // der kleine Begleiter, zwischen Regal und Leiste
  const bx = w * .5, by = h * .862, bs = h * .024;
  glow(c, bx, by, bs * 3.4, 'rgba(150,110,230,.3)');
  c.fillStyle = '#3b2a63';
  c.beginPath(); c.ellipse(bx, by, bs * .88, bs * .8, 0, 0, 6.284); c.fill();
  c.beginPath(); c.ellipse(bx, by - bs * .72, bs * .5, bs * .34, 0, 0, 6.284); c.fill();
  [-.3, .3].forEach((d) => {
    c.fillStyle = '#ffd9f2';
    c.beginPath(); c.ellipse(bx + bs * d, by - bs * .1, bs * .2, bs * .22, 0, 0, 6.284); c.fill();
    c.fillStyle = '#241033';
    c.beginPath(); c.arc(bx + bs * d, by - bs * .08, bs * .1, 0, 6.284); c.fill();
  });
}

/* ============================================================
   Uhr
   ============================================================ */

function tick() {
  const t = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('clock').textContent = t;
  document.querySelectorAll('[data-clock]').forEach((e) => { e.textContent = t; });
}
tick(); setInterval(tick, 20000);

/* ============================================================
   Maßstab: Bühne 1400×788 ins Fach rechnen
   ============================================================ */

/* Das Fach bekommt die Form des Bildschirms, die Wand wird so breit, dass
   sechs solche Fächer in den freien Platz passen — in beide Richtungen.
   Damit fällt beim Hineinfahren kein Rand weg und es bleibt kein Balken übrig. */
const STAGE_W = 1400, SH_MIN = 700, SH_MAX = 1180;

function fit() {
  const sh = Math.round(Math.min(SH_MAX, Math.max(SH_MIN, STAGE_W * innerHeight / innerWidth)));
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty('--vw', innerWidth);
  rootStyle.setProperty('--vh', innerHeight);
  rootStyle.setProperty('--sw', STAGE_W);
  rootStyle.setProperty('--sh', sh);

  const wrap = wall.parentElement;
  const cs = getComputedStyle(wrap);
  const availW = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const ws = getComputedStyle(wall);
  const cols = +ws.getPropertyValue('--cols') || 3;
  const rows = +ws.getPropertyValue('--rows') || 2;
  const gap = parseFloat(ws.gap) || 26;

  const bayW = Math.min(
    (availW - gap * (cols - 1)) / cols,
    ((availH - gap * (rows - 1)) / rows) * (innerWidth / innerHeight),
    520
  );
  wall.style.width = Math.floor(bayW * cols + gap * (cols - 1)) + 'px';

  const r = wall.querySelector('.bay-box').getBoundingClientRect();
  const k = Math.min(r.width / STAGE_W, r.height / sh);   // nichts abschneiden
  wall.querySelectorAll('.screen').forEach((s) => s.style.setProperty('--k', k));
}

/* ============================================================
   Klick → Deckel auf, Kamera hinein
   ============================================================ */

const state = { open: null, busy: false, armed: null };
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

/* Es fliegt nur das eine Fach, nicht die ganze Wand: der Korpus wird an
   seiner gemessenen Stelle festgesetzt (position: fixed, gleiche Geometrie,
   also kein Sprung) und von dort auf Bildschirmgröße gefahren. So muss der
   Browser während der Fahrt eine Fläche zeichnen statt sechs. */
function camera(box) {
  const r = box.getBoundingClientRect();
  const S = Math.max(innerWidth / r.width, innerHeight / r.height);
  const tx = (innerWidth - r.width * S) / 2 - r.left;
  const ty = (innerHeight - r.height * S) / 2 - r.top;
  return { r, S, tx, ty };
}

function pin(box, r) {
  box.style.position = 'fixed';
  box.style.left = r.left + 'px';
  box.style.top = r.top + 'px';
  box.style.width = r.width + 'px';
  box.style.height = r.height + 'px';
}

function unpin(box) {
  box.style.position = box.style.left = box.style.top = box.style.width = box.style.height = '';
}

/* Die Ebene vorbereiten, sobald ein Fach ins Visier gerät. Das kostet einen
   Moment — den nimmt man sich vor dem Klick, nicht im Klick, sonst ruckelt
   der Anfang der Fahrt. */
function arm(bayEl) {
  const box = bayEl && bayEl.querySelector('.bay-box');
  if (!box || box === state.armed) return;
  if (state.armed) state.armed.style.willChange = 'auto';
  box.style.willChange = 'transform';
  state.armed = box;
}
function disarm(box) { if (box) box.style.willChange = 'auto'; if (state.armed === box) state.armed = null; }

function open(bayEl) {
  if (state.open || state.busy) return;
  state.busy = true;
  state.open = bayEl;

  // Kein fit() an dieser Stelle: das Layout steht schon, und ein Reflow
  // ausgerechnet im Klick würde den Start der Fahrt verzögern.
  const box = bayEl.querySelector('.bay-box');
  const cam = camera(box);              // messen, solange nichts verschoben ist
  arm(bayEl);
  pin(box, cam.r);                      // gleiche Stelle, gleiche Größe — kein Sprung
  bayEl.classList.add('flying');
  bayEl.classList.add('open');          // der Deckel schwingt auf …

  // … und im selben Atemzug fährt die Kamera los. Kein requestAnimationFrame
  // dazwischen: dessen Rückruf kann sich verspäten, und genau dann fühlt
  // sich der Zoom nicht mehr wie eine Antwort auf den Klick an.
  box.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.S})`;
  room.classList.add('zoomed');
  sfx('open');

  after(() => {
    disarm(box);                        // neu rastern: der Desktop wird gestochen scharf
    state.busy = false;
    const first = bayEl.querySelector('.dsk-body button');
    if (first) first.focus({ preventScroll: true });
  });
}

function close() {
  const bayEl = state.open;
  if (!bayEl || state.busy) return;
  state.busy = true;
  sfx('close');

  const box = bayEl.querySelector('.bay-box');
  arm(bayEl);
  box.style.transform = '';
  room.classList.remove('zoomed');

  after(() => {
    bayEl.classList.remove('open');     // der Deckel fällt erst zu, wenn das Fach wieder sitzt
    bayEl.classList.remove('flying');
    unpin(box);
    disarm(box);
    state.open = null;
    state.busy = false;
    bayEl.querySelector('.bay-hit').focus({ preventScroll: true });
  });
}

function after(fn) {
  setTimeout(fn, reduced.matches ? 240 : 880);
}

/* Sanfte Geräusche — synthetisch, keine Dateien */
let ac = null;
function sfx(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = kind === 'open' ? 900 : 600;
    o.type = 'triangle';
    o.frequency.setValueAtTime(kind === 'open' ? 180 : 300, t);
    o.frequency.exponentialRampToValueAtTime(kind === 'open' ? 420 : 140, t + .34);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.06, t + .03);
    g.gain.exponentialRampToValueAtTime(.0001, t + .42);
    o.connect(f); f.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + .45);
  } catch (e) { /* Ton ist Zugabe, nie Voraussetzung */ }
}

/* ============================================================
   Bedienung: Maus, Tastatur, Steuerkreuz
   ============================================================ */

wall.addEventListener('pointerover', (e) => { if (!state.open) arm(e.target.closest('.bay')); });
wall.addEventListener('focusin', (e) => { if (!state.open) arm(e.target.closest('.bay')); });

wall.addEventListener('click', (e) => {
  const hit = e.target.closest('.bay-hit');
  if (hit) { open(hit.closest('.bay')); return; }
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'close') close();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.open) { close(); return; }
  if (state.open) return;

  const hits = [...wall.querySelectorAll('.bay-hit')];
  const cur = hits.indexOf(document.activeElement);
  if (cur < 0) return;
  const cols = +getComputedStyle(wall).getPropertyValue('--cols') || 3;
  const map = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols };
  if (map[e.key] != null) {
    e.preventDefault();
    const next = hits[cur + map[e.key]];
    if (next) next.focus();
  }
});

document.querySelector('.dock').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'peek') {
    const on = wall.classList.toggle('peeking');
    wall.querySelectorAll('.bay').forEach((x) => x.classList.toggle('peek', on));
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  }
});

addEventListener('resize', () => {
  paintSky();
  paintFg();
  if (!state.open) { fit(); return; }

  // Fenstergröße geändert, während ein Fach offen ist: ohne Animation neu setzen
  const bayEl = state.open, box = bayEl.querySelector('.bay-box');
  const prev = box.style.transition;
  box.style.transition = 'none';
  unpin(box); box.style.transform = '';
  fit();
  const cam = camera(box);
  pin(box, cam.r);
  box.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.S})`;
  box.getBoundingClientRect();          // Stand festschreiben, bevor die Übergänge zurückkommen
  box.style.transition = prev;
});

fit();
paintFg();
requestAnimationFrame(fit);
})();
</script>
</body>
</html>
