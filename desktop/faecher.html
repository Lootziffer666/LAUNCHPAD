<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LAUNCHPAD — Fächerwand</title>
<style>
/* ============================================================
   LAUNCHPAD — Fächerwand

   Sechs Fächer mit Deckeln, in jedem wartet ein Desktop. Ein Klick:
   der Deckel schwingt auf — linke Reihe nach links, rechte nach rechts,
   die mittleren nach oben und unten — und ohne Pause fährt die Kamera
   hinein, bis das Fach das ganze Bild füllt.

   Flächen und Winkel der Fächer sind aus der Vorlage ausgemessen
   (magenta markiert) und werden per Homographie exakt reproduziert;
   das Regal, sein Rahmen, die Leiste und die Bewohner am Rand kommen
   als Bild aus derselben Vorlage.
   ============================================================ */

:root {
  --night:      #050d1f;
  --cyan:       #38bdf8;
  --gold:       #ffc83d;

  --ink:        #eef4ff;
  --ink-soft:   #b7c7e9;
  --ink-mute:   #7b8bb4;

  --ease:  cubic-bezier(.25, 1, .5, 1);
  --lid:   cubic-bezier(.22, .9, .24, 1.02);
  --dolly: cubic-bezier(.33, .05, .12, 1);

  --t-lid:   620ms;
  --t-dolly: 940ms;

  /* Bühne des Desktops: Breite fest, Höhe folgt dem Bildschirm */
  --sw: 1400; --sh: 788;

  --font: "Outfit", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--night);
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; border-radius: 8px; }

/* ============================================================
   Raum und Regal
   ============================================================ */

.room { position: fixed; inset: 0; overflow: hidden; }

/* Das Regal ist die Vorlage selbst. Es behält sein Seitenverhältnis,
   damit die ausgemessenen Fachflächen darauf sitzen bleiben. */
#regal {
  position: absolute; left: 0; top: 0;
  transform-origin: 0 0;
  /* dauerhaft eigene Ebene: sonst kostet die erste Fahrt den Moment, in
     dem der Browser das Regal zum ersten Mal vergrößert zeichnet */
  will-change: transform;
  background-size: 100% 100%;
  background-repeat: no-repeat;
}

/* Beim Hineinfahren geht im Raum das Licht aus — eine Fläche statt
   sechs einzeln ausgeblendeter Fächer. */
.scrim {
  position: fixed; inset: 0; z-index: 50; pointer-events: none;
  background: var(--night); opacity: 0;
  transition: opacity .72s var(--ease);
}
.room.zoomed .scrim { opacity: .95; }

/* ============================================================
   Ein Fach

   Jedes Fach ist bildschirmgroß und wird von einer Homographie in
   seine gemessene Fläche gelegt. Beim Öffnen fällt diese Abbildung
   weg — dann liegt das Fach deckungsgleich auf dem Bildschirm.
   ============================================================ */

/* Zwei Ebenen, weil zwei verschiedene Dinge passieren:
   .bay      fährt heran — reines Verschieben und Vergrößern,
   .bay-face liegt schräg in der Vorlage und richtet sich dabei auf.
   In einer einzigen Matrix vermischt, interpoliert der Browser beides
   zusammen, und aus der Fahrt wird ein Aufpoppen. */
.bay {
  position: fixed; left: 0; top: 0;
  width: 100vw; height: 100vh;
  transform-origin: 0 0;
  transform: var(--dolly);
  z-index: 10;
}
.bay.open { z-index: 60; }

.bay-face {
  position: absolute; inset: 0;
  transform-origin: 0 0;
  transform: var(--warp);
}

.bay-inner {
  position: absolute; inset: 0;
  overflow: hidden;
  background: #040b18;
}

.screen {
  position: absolute; left: 50%; top: 50%;
  width: calc(var(--sw) * 1px); height: calc(var(--sh) * 1px);
  transform: translate(-50%, -50%) scale(var(--k, .3));
  pointer-events: none;
}
.bay.open .screen { pointer-events: auto; }

/* warmes Licht, das im geschlossenen Fach aus dem Spalt quillt */
.spill {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: radial-gradient(120% 80% at 50% 106%, rgba(255,200,61,.26), transparent 60%);
  transition: opacity .5s var(--ease);
}
.bay.open .spill { opacity: 0; }

/* ---- der Deckel ---- */

.lid {
  position: absolute; inset: 0; z-index: 5;
  background-image: var(--art);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  transition: transform var(--t-lid) var(--lid), opacity .28s linear .36s;
  backface-visibility: hidden;
}

/* Der Angelpunkt liegt innen — die Scharnierbolzen sitzen in der Vorlage
   auf den senkrechten Innenstegen. Die linke Reihe ist also rechts
   angeschlagen und geht nach links auf, die rechte umgekehrt; die
   mittleren hängen an der waagerechten Mitte und gehen nach oben bzw.
   unten. In Ruhe liegt der Deckel flach auf seiner gemessenen Fläche. */
.bay[data-open="links"]  .lid { transform-origin: 100% 50%; }
.bay[data-open="rechts"] .lid { transform-origin: 0% 50%; }
.bay[data-open="oben"]   .lid { transform-origin: 50% 100%; }
.bay[data-open="unten"]  .lid { transform-origin: 50% 0%; }

/* Ein Spalt weit, wenn man hinsieht: genug, um zu erkennen, dass etwas
   drin ist, wenig genug, um dem Nachbarfach nicht ins Bild zu schwingen. */
.bay[data-open="links"]:hover  .lid, .bay[data-open="links"]:focus-within  .lid { transform: perspective(1500px) rotateY(15deg); }
.bay[data-open="rechts"]:hover .lid, .bay[data-open="rechts"]:focus-within .lid { transform: perspective(1500px) rotateY(-15deg); }
.bay[data-open="oben"]:hover   .lid, .bay[data-open="oben"]:focus-within   .lid { transform: perspective(1500px) rotateX(-15deg); }
.bay[data-open="unten"]:hover  .lid, .bay[data-open="unten"]:focus-within  .lid { transform: perspective(1500px) rotateX(15deg); }

/* Alle sechs zugleich: noch zurückhaltender, sonst wird die Wand unruhig. */
.bay[data-open="links"].peek  .lid { transform: perspective(1500px) rotateY(9deg); }
.bay[data-open="rechts"].peek .lid { transform: perspective(1500px) rotateY(-9deg); }
.bay[data-open="oben"].peek   .lid { transform: perspective(1500px) rotateX(-9deg); }
.bay[data-open="unten"].peek  .lid { transform: perspective(1500px) rotateX(9deg); }

.bay[data-open="links"].open  .lid { transform: perspective(1500px) rotateY(115deg);  opacity: 0; }
.bay[data-open="rechts"].open .lid { transform: perspective(1500px) rotateY(-115deg); opacity: 0; }
.bay[data-open="oben"].open   .lid { transform: perspective(1500px) rotateX(-115deg); opacity: 0; }
.bay[data-open="unten"].open  .lid { transform: perspective(1500px) rotateX(115deg);  opacity: 0; }

.bay-hit { position: absolute; inset: 0; z-index: 7; }
.bay.open .bay-hit, .room.zoomed .bay-hit { pointer-events: none; }

/* Schaltflächen auf der Leiste der Vorlage */
.hot { position: absolute; z-index: 20; border-radius: 10px; }
.room.zoomed .hot { pointer-events: none; }


/* Leiste im Desktop (dieselben Knöpfe wie unten im Regal) */
.dock-mid { display: flex; align-items: center; gap: 10px; }
.dbtn {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 44px; padding: 10px 16px; border-radius: 999px;
  color: var(--ink-soft); font-size: 15px; font-weight: 600;
  transition: background .16s, color .16s;
}
.dbtn svg { width: 22px; height: 22px; }
.dbtn:hover { background: rgba(255,255,255,.09); color: #fff; }
.dbtn.on { color: var(--cyan); }
.dbtn.gate { background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }

/* ============================================================
   Der Desktop im Fach
   ============================================================ */

/* Die Welt vom Deckel bleibt drinnen als Kulisse stehen */
.screen-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.screen-bg::after { /* die Kulisse bleibt Kulisse — Inhalt zuerst */
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(4,9,24,.86) 0%, rgba(4,9,24,.62) 34%, rgba(4,9,24,.94) 100%),
    linear-gradient(98deg, rgba(4,9,24,.86) 0%, rgba(4,9,24,.2) 62%);
}
/* … in der Farbe ihres Fachs: drinnen ist man in derselben Welt,
   die vorher auf dem Deckel zu sehen war */
.screen-tint {
  position: absolute; inset: 0; opacity: .42;
  background: linear-gradient(98deg, var(--tint) 0%, rgba(0,0,0,0) 62%);
}

.dsk { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 34px 56px 0; }

.dsk-top { display: flex; align-items: center; justify-content: space-between; flex: none; }
.dsk-top .who h1 { font-size: 21px; }
.dsk-top .who p { font-size: 12.5px; }
.dsk-top .avatar { width: 44px; height: 44px; }
.dsk-top .status .clock { font-size: 16px; }
.dsk-top .status svg { width: 17px; height: 17px; }
.dsk-top .batt { width: 24px; height: 12px; }

.dsk-top { flex: none; display: flex; align-items: center; justify-content: space-between; }
.dsk-top .who { display: flex; align-items: center; gap: 13px; }
.dsk-top .avatar {
  width: 46px; height: 46px; border-radius: 50%; flex: none;
  background-size: cover; background-position: center;
  box-shadow: 0 0 0 2px rgba(150,200,255,.5), 0 0 20px rgba(56,189,248,.25);
}
.dsk-top .who b { display: block; font-size: 21px; font-weight: 700; line-height: 1.1; }
.dsk-top .who i { display: block; font-style: normal; font-size: 13px; color: var(--ink-mute); font-weight: 500; }
.dsk-top .status { display: flex; align-items: center; gap: 15px; color: var(--ink-soft); }
.dsk-top .status svg { width: 18px; height: 18px; opacity: .85; }
.dsk-top .clock { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dsk-top .batt { width: 26px; height: 13px; border: 1.5px solid rgba(190,210,245,.7); border-radius: 4px; position: relative; }
.dsk-top .batt::after { content: ""; position: absolute; top: 2px; left: 2px; bottom: 2px; width: 62%; border-radius: 2px; background: #5fd97a; }
.dsk-top .batt::before { content: ""; position: absolute; right: -4px; top: 3.5px; bottom: 3.5px; width: 2.5px; border-radius: 0 2px 2px 0; background: rgba(190,210,245,.7); }

.dsk-head { flex: none; margin: 26px 0 4px; }
.dsk-head h2 { font-size: 46px; font-weight: 700; letter-spacing: -.6px; }
.dsk-head p { font-size: 17px; color: var(--ink-soft); font-weight: 500; margin-top: 4px; }

.dsk-body { flex: 1; overflow: hidden; padding-top: 22px; display: flex; flex-direction: column; gap: 26px; }

.sec-title { font-size: 15px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 13px; }

/* Karten mit gemaltem Motiv */
.row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.row.n3 { grid-template-columns: repeat(3, 1fr); }
.card {
  position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden;
  box-shadow: 0 16px 30px -14px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.10);
  transition: transform .22s var(--ease), box-shadow .22s var(--ease);
}
.card:hover { transform: translateY(-4px); box-shadow: 0 22px 38px -14px rgba(0,0,0,.85), inset 0 0 0 1px rgba(120,200,255,.4); }
.card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .cap {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 16px 14px; text-align: left;
  background: linear-gradient(180deg, transparent, rgba(3,8,20,.9) 62%);
}
.card .cap b { display: block; font-size: 17px; font-weight: 700; }
.card .cap span { display: block; font-size: 13px; color: var(--ink-soft); font-weight: 500; margin-top: 2px; }
.bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.2); margin-top: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--cyan); }

/* App-Kacheln */
.tiles { display: flex; gap: 16px; flex-wrap: wrap; }
.tile {
  width: 132px; padding: 16px 10px 13px; border-radius: 16px; text-align: center;
  background: rgba(255,255,255,.055);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.13);
  transition: background .18s, transform .18s var(--ease);
}
.tile:hover { background: rgba(255,255,255,.12); transform: translateY(-3px); }
.tile .ti { width: 46px; height: 46px; margin: 0 auto 10px; display: grid; place-items: center; border-radius: 13px; }
.tile .ti svg { width: 26px; height: 26px; }
.tile b { display: block; font-size: 14px; font-weight: 600; }
.tile span { display: block; font-size: 11.5px; color: var(--ink-mute); margin-top: 2px; }

/* Kategorie-Pillen */
.chips { display: flex; gap: 13px; flex-wrap: wrap; }
.chip {
  padding: 12px 26px; border-radius: 12px; font-size: 14.5px; font-weight: 600; color: var(--ink-soft);
  background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.13);
  transition: background .16s, color .16s;
}
.chip:hover { background: rgba(255,255,255,.13); color: #fff; }
.chip.on { color: #fff; box-shadow: inset 0 0 0 1px rgba(56,189,248,.6); background: rgba(56,189,248,.15); }

/* Bücher */
.shelf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.book {
  display: flex; gap: 14px; padding: 14px; border-radius: 14px; text-align: left;
  background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
  transition: background .18s, transform .18s var(--ease);
}
.book:hover { background: rgba(255,255,255,.1); transform: translateY(-3px); }
.book canvas { width: 62px; height: 86px; border-radius: 6px; flex: none; box-shadow: 0 6px 14px rgba(0,0,0,.5); }
.book b { display: block; font-size: 14.5px; font-weight: 700; line-height: 1.25; }
.book span { display: block; font-size: 12px; color: var(--ink-mute); margin-top: 3px; }
.book em { display: block; font-style: normal; font-size: 14px; font-weight: 700; color: var(--gold); margin-top: 10px; }

/* Fußleiste des Desktops */
.dsk-foot {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0 20px; margin-top: auto;
}

/* ============================================================
   Zurückhaltung, wenn gewünscht
   ============================================================ */

/* Wer weniger Bewegung eingestellt hat, bekommt denselben Weg — nur kurz:
   das Fach ist trotzdem da, wo es hingehört. */
@media (prefers-reduced-motion: reduce) {
  :root { --t-lid: 1ms; --t-dolly: 200ms; --dolly: linear; }
  .card:hover, .tile:hover, .book:hover { transform: none; }
  .critter .eye { animation: none; }
}

@media (max-width: 900px) {
  .wall { --cols: 2; --rows: 3; }
  .lid-face h2 { font-size: 26px; }
  .lid-face .glyph { width: 60px; height: 60px; }
}
</style>
</head>

  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);

function paint(cv, key, seed, w, h) {
  const p = PAL[key] || PAL.castle;
  const dpr = 1.6;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  const r = mulberry(seed);

  let g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, p.sky[0]); g.addColorStop(1, p.sky[1]);
  c.fillStyle = g; c.fillRect(0, 0, w, h);

  if (p.stars) {
    const n = 26 * p.stars;
    for (let i = 0; i < n; i++) {
      const x = r() * w, y = r() * h * .72, s = r() * 1.3 + .3;
      c.globalAlpha = .25 + r() * .6;
      c.fillStyle = r() > .82 ? '#ffe6a8' : '#ffffff';
      c.beginPath(); c.arc(x, y, s, 0, 6.284); c.fill();
    }
    c.globalAlpha = 1;
  }

  const ox = w * (.18 + r() * .64), oy = h * (.1 + r() * .26), orad = h * (.62 + r() * .6);
  g = c.createRadialGradient(ox, oy, 0, ox, oy, orad);
  g.addColorStop(0, p.glow); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);

  const horizon = h * (p.water ? .62 : .76);
  p.ridge.forEach((col, i) => {
    const base = horizon - (p.ridge.length - 1 - i) * h * .07;
    const amp = h * (.3 - i * .06);
    c.fillStyle = col;
    c.beginPath(); c.moveTo(0, h);
    let y = base - r() * amp * .4;
    for (let x = 0; x <= w + 24; x += w / 7) {
      const ny = base - Math.abs(Math.sin(x * (.7 + i) / w * 3 + seed)) * amp * (.5 + r() * .7);
      c.quadraticCurveTo(x - w / 14, (y + ny) / 2 - amp * .12, x, ny);
      y = ny;
    }
    c.lineTo(w, h); c.closePath(); c.fill();
  });

  if (p.water) {
    c.fillStyle = p.water; c.fillRect(0, horizon, w, h - horizon);

    // Spiegelung des Lichts — weich auslaufend, damit kein Balken entsteht
    c.save();
    c.beginPath(); c.rect(0, horizon, w, h - horizon); c.clip();
    g = c.createRadialGradient(ox, horizon, 0, ox, horizon, Math.max(w, h) * .42);
    g.addColorStop(0, 'rgba(255,255,255,.24)');
    g.addColorStop(.55, 'rgba(255,255,255,.06)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, horizon, w, h - horizon);

    // ein paar Kräusel, kurz und leise
    c.lineCap = 'round';
    for (let i = 0; i < 9; i++) {
      const t = i / 9;
      const y = horizon + (h - horizon) * (t * t * .95 + .05);
      const len = w * (.06 + r() * .16) * (1 - t * .4);
      const x = ox + (r() - .5) * w * .5 - len / 2;
      c.strokeStyle = `rgba(255,255,255,${(.16 - t * .1).toFixed(3)})`;
      c.lineWidth = Math.max(1, (h - horizon) * .022);
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + len, y); c.stroke();
    }
    c.restore();

    // Horizontkante
    g = c.createLinearGradient(0, horizon - h * .03, 0, horizon + h * .02);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(.7, 'rgba(255,255,255,.13)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, horizon - h * .03, w, h * .05);
  }

  g = c.createRadialGradient(w / 2, h * .45, h * .2, w / 2, h * .5, h * 1.1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(2,5,14,.55)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
}

/* ============================================================
   Die Fächer auf ihre gemessenen Flächen legen

   Eine Homographie bildet das bildschirmgroße Fach auf sein Viereck ab.
   Genau diese Abbildung fällt beim Öffnen weg, deshalb landet das Fach
   am Ende exakt auf dem Bildschirm — ohne Rechnerei mit Mittelpunkten.
   ============================================================ */

function quadMatrix(w, h, q) {
  const [x0, y0] = q[0], [x1, y1] = q[1], [x2, y2] = q[2], [x3, y3] = q[3];
  const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
  let a, b, c, d, e, f, p, r;
  if (Math.abs(sx) < 1e-9 && Math.abs(sy) < 1e-9) {         // rein affin
    a = x1 - x0; b = x3 - x0; c = x0;
    d = y1 - y0; e = y3 - y0; f = y0; p = r = 0;
  } else {
    const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2;
    const den = dx1 * dy2 - dy1 * dx2;
    p = (sx * dy2 - sy * dx2) / den;
    r = (dx1 * sy - dy1 * sx) / den;
    a = x1 - x0 + p * x1; b = x3 - x0 + r * x3; c = x0;
    d = y1 - y0 + p * y1; e = y3 - y0 + r * y3; f = y0;
  }
  return `matrix3d(${a / w},${d / w},0,${p / w},` +
         `${b / h},${e / h},0,${r / h},` +
         `0,0,1,0,` +
         `${c},${f},0,1)`;
}

const STAGE_W = 1400, SH_MIN = 700, SH_MAX = 1180;
const geom = [];

function fit() {
  // Bühne des Desktops
  const sh = Math.round(Math.min(SH_MAX, Math.max(SH_MIN, STAGE_W * innerHeight / innerWidth)));
  const rs = document.documentElement.style;
  rs.setProperty('--sw', STAGE_W);
  rs.setProperty('--sh', sh);
  const k = Math.min(innerWidth / STAGE_W, innerHeight / sh);
  document.querySelectorAll('.screen').forEach((s) => s.style.setProperty('--k', k));

  // Regal einpassen, ohne sein Seitenverhältnis zu verbiegen
  const scale = Math.min(innerWidth / REGAL_W, innerHeight / REGAL_H);
  const rw = REGAL_W * scale, rh = REGAL_H * scale;
  const rx = (innerWidth - rw) / 2, ry = (innerHeight - rh) / 2;
  regal.style.width = rw + 'px';
  regal.style.height = rh + 'px';
  regal.style.left = rx + 'px';
  regal.style.top = ry + 'px';

  // Fachflächen in Bildschirmkoordinaten, zerlegt in Anfahrt und Form
  bays.forEach((el, i) => {
    const q = QUADS[i].map(([fx, fy]) => [rx + fx * rw, ry + fy * rh]);
    const xs = q.map((c) => c[0]), ys = q.map((c) => c[1]);
    const bx = Math.min(...xs), by = Math.min(...ys);
    const bw = Math.max(...xs) - bx, bh = Math.max(...ys) - by;
    const sx = bw / innerWidth, sy = bh / innerHeight;

    // Die Fahrt: das umschließende Rechteck des Fachs, sonst nichts.
    el.style.setProperty('--dolly', `translate(${bx}px, ${by}px) scale(${sx}, ${sy})`);

    // Die Form: das Viereck, ausgedrückt im Koordinatensystem der Fahrt.
    const local = q.map(([x, y]) => [(x - bx) / sx, (y - by) / sy]);
    el.querySelector('.bay-face').style.setProperty('--warp', quadMatrix(innerWidth, innerHeight, local));

    geom[i] = {
      bx, by, sx, sy,
      fx: Math.abs(1 - sx) < 1e-4 ? 0 : bx / (1 - sx),   // Fluchtpunkt der Fahrt
      fy: Math.abs(1 - sy) < 1e-4 ? 0 : by / (1 - sy),
      warp: quadMatrix(innerWidth, innerHeight, local)
    };
  });

  hots.forEach((b, i) => {
    const h = HOTS[i];
    b.style.left = (rx + h.x * rw) + 'px';
    b.style.top = (ry + h.y * rh) + 'px';
    b.style.width = (h.w * rw) + 'px';
    b.style.height = (h.h * rh) + 'px';
  });
}

/* ============================================================
   Klick → Deckel auf, Kamera hinein
   ============================================================ */

const state = { open: null, busy: false, armed: null, wantsOut: false };
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const running = new Map();

/* Das Fach als eigene Ebene vorbereiten, sobald es ins Visier gerät —
   nicht erst im Klick, sonst ruckelt der Anfang der Fahrt. */
function arm(el) {
  if (!el || el === state.armed) return;
  if (state.armed) state.armed.style.willChange = 'auto';
  el.style.willChange = 'transform';
  state.armed = el;
}
function disarm(el) {
  if (el) el.style.willChange = 'auto';
  if (state.armed === el) state.armed = null;
}

/* Die Fahrt.

   Ein Maßstab, der gleichmäßig wächst, sieht nicht nach Fahrt aus: von .27
   auf .6 passiert optisch fast alles, der Rest ist Nachlauf. Wer sich einem
   Gegenstand mit gleichbleibendem Tempo nähert, sieht ihn dagegen
   exponentiell wachsen. Genau das wird hier in Stützpunkte gelegt — jeder
   Schritt vergrößert um denselben Faktor, gegen Ende etwas ausklingend.
   Und es ist wirklich eine Fahrt: alle Zwischenbilder sind Vergrößerungen
   um einen festen Fluchtpunkt, nichts wandert quer durchs Bild. */
const STOPS = 14;

/* Ein Bild der Fahrt: Maßstab k um den Fluchtpunkt, k wächst je Schritt um
   denselben Faktor. `on` hängt ein feststehendes Ziel darunter — so fährt
   nicht nur das gewählte Fach, sondern die ganze Wand mit. */
function flightStep(g, t, world, on) {
  const e = 1 - Math.pow(1 - t, 1.35);
  let kx = Math.pow(g.sx, 1 - e), ky = Math.pow(g.sy, 1 - e);
  if (world) { kx /= g.sx; ky /= g.sy; }        // Sicht des stehenden Regals
  let tx = g.fx * (1 - kx), ty = g.fy * (1 - ky), ax = kx, ay = ky;
  if (on) {                                     // hintereinander ausgeführt
    tx += kx * on.bx; ty += ky * on.by;
    ax = kx * on.sx;  ay = ky * on.sy;
  }
  return `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(${ax.toFixed(5)}, ${ay.toFixed(5)})`;
}

function flightFrames(g, dir, world, on) {
  const frames = [];
  for (let n = 0; n <= STOPS; n++) {
    frames.push({ transform: flightStep(g, n / STOPS, world, on) });
  }
  return dir === 'in' ? frames : frames.reverse();
}

function fly(el, i, dir) {
  const g = geom[i];
  const T = reduced.matches ? 200 : parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--t-dolly')) || 940;
  const face = el.querySelector('.bay-face');

  const prev = running.get(el);
  if (prev) prev.forEach((a) => a.cancel());

  const move = el.animate(flightFrames(g, dir), { duration: T, easing: 'linear', fill: 'forwards' });

  // Die ganze Wand fährt mit: Regal und die übrigen fünf Deckel ziehen an
  // der Kamera vorbei. Ohne das wächst nur eine Fläche über einem
  // stehenden Bild — und genau das sieht nach Einblenden aus statt nach
  // Hineinfahren.
  const opts = { duration: T, easing: 'linear', fill: 'forwards' };
  const rest = [regal.animate(flightFrames(g, dir, true), opts)];
  bays.forEach((other, j) => {
    if (other === el) return;
    // Vom Nachbarfach ist nur der Deckel zu sehen; sein Desktop muss die
    // Fahrt nicht mitzeichnen.
    other.querySelector('.bay-inner').style.visibility = dir === 'in' ? 'hidden' : '';
    rest.push(other.animate(flightFrames(g, dir, true, geom[j]), opts));
  });

  // Die Schräge richtet sich früh auf (beim Schließen spät wieder ein),
  // damit die Fahrt selbst ungestört bleibt.
  const straight = face.animate(
    dir === 'in' ? [{ transform: g.warp }, { transform: 'none' }]
                 : [{ transform: 'none' }, { transform: g.warp }],
    { duration: T * .58, delay: dir === 'in' ? 0 : T * .42,
      easing: dir === 'in' ? 'cubic-bezier(.32,0,.24,1)' : 'cubic-bezier(.76,0,.68,1)',
      fill: 'forwards' });

  running.set(el, [move, straight, ...rest]);
  return Promise.all([move, straight, ...rest].map((a) => a.finished)).catch(() => {});
}

function open(el) {
  if (state.open || state.busy) return;
  const i = bays.indexOf(el);
  state.busy = true;
  state.open = el;
  arm(el);
  el.querySelector('.screen').inert = false;
  el.classList.add('open');       // Deckel schwingt auf und die Fahrt beginnt —
  room.classList.add('zoomed');   // beides im selben Bild
  sfx('open');
  fly(el, i, 'in').then(() => {
    disarm(el);                   // neu rastern: der Desktop wird scharf
    state.busy = false;
    // Wer während der Fahrt schon wieder raus wollte, kommt jetzt raus.
    if (state.wantsOut) { state.wantsOut = false; close(); return; }
    const first = el.querySelector('.dsk-body button');
    if (first) first.focus({ preventScroll: true });
  });
}

function close() {
  const el = state.open;
  if (!el) return;
  if (state.busy) { state.wantsOut = true; return; }   // gemerkt, nicht verschluckt
  const i = bays.indexOf(el);
  state.busy = true;
  sfx('close');
  arm(el);
  el.classList.remove('open');
  room.classList.remove('zoomed');
  fly(el, i, 'out').then(() => {
    const anims = running.get(el);
    if (anims) anims.forEach((a) => a.cancel());   // zurück auf die Werte aus fit()
    running.delete(el);
    bays.forEach((other) => { other.querySelector('.bay-inner').style.visibility = ''; });
    disarm(el);
    el.querySelector('.screen').inert = true;
    state.open = null;
    state.busy = false;
    el.querySelector('.bay-hit').focus({ preventScroll: true });
  });
}

/* Sanfte Geräusche — synthetisch, keine Dateien */
let ac = null;
function sfx(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = kind === 'open' ? 900 : 600;
    o.type = 'triangle';
    o.frequency.setValueAtTime(kind === 'open' ? 180 : 300, t);
    o.frequency.exponentialRampToValueAtTime(kind === 'open' ? 420 : 140, t + .34);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.06, t + .03);
    g.gain.exponentialRampToValueAtTime(.0001, t + .42);
    o.connect(f); f.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + .45);
  } catch (e) { /* Ton ist Zugabe, nie Voraussetzung */ }
}

/* ============================================================
   Bedienung: Maus, Tastatur, Steuerkreuz
   ============================================================ */

room.addEventListener('pointerover', (e) => {
  if (state.open) return;
  const bay = e.target.closest('.bay');
  if (bay) arm(bay);
});
room.addEventListener('focusin', (e) => {
  if (state.open) return;
  const bay = e.target.closest('.bay');
  if (bay) arm(bay);
});

room.addEventListener('click', (e) => {
  const hit = e.target.closest('.bay-hit');
  if (hit) { open(hit.closest('.bay')); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act === 'close') close();
  if (act.dataset.act === 'peek') {
    const on = room.classList.toggle('peeking');
    bays.forEach((b) => b.classList.toggle('peek', on));
    act.setAttribute('aria-pressed', String(on));
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.open) { close(); return; }
  if (state.open) return;

  const hits = [...room.querySelectorAll('.bay-hit')];
  const cur = hits.indexOf(document.activeElement);
  if (cur < 0) return;
  const cols = 3;
  const map = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols };
  if (map[e.key] != null) {
    e.preventDefault();
    const next = hits[cur + map[e.key]];
    if (next) next.focus();
  }
});

addEventListener('resize', fit);

fit();
requestAnimationFrame(fit);
})();
</script>
</body>
</html>
